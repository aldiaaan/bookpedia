services:
  db:
    image: postgres:17-alpine
    container_name: bookpedia-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: bookpedia
    volumes:
      - .tmp/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookpedia"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: bookpedia-pgweb
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://admin:admin123@db:5432/bookpedia?sslmode=disable
    depends_on:
      db:
        condition: service_healthy